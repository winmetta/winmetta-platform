# Dependabot version updates. The schedule is the 1st of every second month at 09:00 UTC.
# GitHub Actions pinned by commit SHA keep their "# vX.Y.Z" comment, which Dependabot updates too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 9 1 */2 *'
    commit-message:
      prefix: 'chore(ci)'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: '0 9 1 */2 *'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      all:
        patterns: ['*']
    ignore:
      # typescript-eslint supports TypeScript <6.1.0 only; revisit when it supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep @types/node on the Node 24 runtime pinned in mise.toml and .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /infra/pulumi
    schedule:
      interval: cron
      cronjob: '0 9 1 */2 *'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      all:
        patterns: ['*']
    ignore:
      # Keep in step with the root workspace, which stays on TypeScript 6 until typescript-eslint supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep @types/node on the Node 24 runtime pinned in engines.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
